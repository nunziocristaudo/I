<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Photography Showcase</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      --bg: #ffffff;
      --text: #000000;
      --caption-bg: rgba(0,0,0,0.7);
      --caption-text: #ffffff;
      background: var(--bg);
      color: var(--text);
    }
    body.dark-mode {
      --bg: #121212;
      --text: #f0f0f0;
      --caption-bg: rgba(255,255,255,0.3);
      --caption-text: #000000;
    }
    header {
      position: relative;
      text-align: center;
      padding: 2rem 0;
      font-size: 1.5rem;
      letter-spacing: 0.1em;
      background: var(--bg);
      color: var(--text);
    }
    #dark-toggle {
      position: absolute;
      right: 1rem;
      top: 50%;
      transform: translateY(-50%);
      padding: 0.25rem 0.75rem;
      border: none;
      border-radius: 4px;
      background: #000;
      color: #fff;
      cursor: pointer;
      display: none;
    }
    body.dark-mode #dark-toggle {
      background: #fff;
      color: #000;
    }
    header:hover #dark-toggle {
      display: block;
    }
    .gallery {
      column-count: 4;
      column-gap: 1rem;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 1rem;
    }
    .gallery-item {
      break-inside: avoid;
      margin-bottom: 1rem;
      position: relative;
      overflow: hidden;
      cursor: pointer;
    }
    .gallery-item img {
      width: 100%;
      display: block;
      transition: transform 0.3s;
    }
    .gallery-item:hover img {
      transform: scale(1.05);
    }
    .caption {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 0.5rem;
      background: var(--caption-bg);
      color: var(--caption-text);
      font-size: 0.9rem;
      text-align: center;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .caption.hidden {
      display: none;
    }
    .gallery-item:hover .caption {
      opacity: 1;
    }
    .viewer {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.9);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999;
    }
    .viewer.hidden {
      display: none;
    }
    #viewer-img {
      max-width: 90%;
      max-height: 90%;
    }
    #viewer-caption {
      margin-top: 0.5rem;
      color: #fff;
    }
    @media (max-width: 768px) {
      .gallery { column-count: 2; }
    }
    @media (max-width: 480px) {
      .gallery { column-count: 1; }
    }
  </style>
</head>
<body>
  <header>
    Photography
    <button id="dark-toggle" aria-label="Toggle dark mode">&#9788;</button>
  </header>
  <div class="gallery" id="gallery"></div>
  <div id="viewer" class="viewer hidden">
    <img id="viewer-img" src="" alt="" />
    <div id="viewer-caption"></div>
  </div>

  <script>
    const baseURL = 'https://dev.tinysquares.io/';
    const workerURL = 'https://quiet-mouse-8001.flaxen-huskier-06.workers.dev/';

    let filenames = [];
    let currentIndex = 0;

    const viewer = document.getElementById('viewer');
    const viewerImg = document.getElementById('viewer-img');
    const viewerCaption = document.getElementById('viewer-caption');

    async function fetchFilenames() {
      const res = await fetch(workerURL);
      const list = await res.json();
      return list.sort(() => Math.random() - 0.5);
    }

    function showImage(index) {
      currentIndex = (index + filenames.length) % filenames.length;
      viewerImg.src = baseURL + filenames[currentIndex];
      viewerCaption.textContent = filenames[currentIndex];
    }

    function openViewer(index) {
      showImage(index);
      viewer.classList.remove('hidden');
    }

    function closeViewer() {
      viewer.classList.add('hidden');
    }

    function showNext() {
      showImage(currentIndex + 1);
    }

    function showPrev() {
      showImage(currentIndex - 1);
    }

    let startX = 0;
    let startY = 0;

    viewer.addEventListener('touchstart', e => {
      if (e.touches.length === 1) {
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
      }
    });

    viewer.addEventListener('touchend', e => {
      const dx = e.changedTouches[0].clientX - startX;
      const dy = e.changedTouches[0].clientY - startY;
      if (Math.abs(dx) > 30 || Math.abs(dy) > 30) {
        if (Math.abs(dx) >= Math.abs(dy)) {
          dx < 0 ? showNext() : showPrev();
        } else {
          dy < 0 ? showNext() : showPrev();
        }
      }
    });

    viewer.addEventListener('dblclick', closeViewer);

    document.addEventListener('keydown', e => {
      if (viewer.classList.contains('hidden')) return;
      if (e.key === 'ArrowRight' || e.key === 'ArrowDown') showNext();
      else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') showPrev();
      else if (e.key === 'Escape') closeViewer();
    });

    async function init() {
      const container = document.getElementById('gallery');
      filenames = await fetchFilenames();

      filenames.forEach((name, idx) => {
        const div = document.createElement('div');
        div.className = 'gallery-item';

        const img = document.createElement('img');
        img.src = baseURL + name;

        const caption = document.createElement('div');
        caption.className = 'caption';
        caption.textContent = name;

        div.appendChild(img);
        div.appendChild(caption);
        div.addEventListener('click', () => openViewer(idx));
        container.appendChild(div);
      });
    }

    init();

    document.getElementById('dark-toggle').addEventListener('click', () => {
      document.body.classList.toggle('dark-mode');
    });
  </script>
</body>
</html>
