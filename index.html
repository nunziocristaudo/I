<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Instagram Style Profile</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      --bg: #ffffff;
      --text: #000000;
      background: var(--bg);
      color: var(--text);
    }
    body.dark-mode {
      --bg: #121212;
      --text: #f0f0f0;
    }
    header {
      background: var(--bg);
      color: var(--text);
      border-bottom: 1px solid #dbdbdb;
      padding: 1rem;
    }
    .profile {
      max-width: 935px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      position: relative;
    }
    .avatar {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      object-fit: cover;
      margin-right: 2rem;
    }
    .info {
      flex: 1;
    }
    .username {
      font-size: 1.8rem;
      margin: 0 0 0.5rem 0;
    }
    .stats span {
      margin-right: 1rem;
    }
    #dark-toggle {
      position: absolute;
      right: 0;
      top: 0;
      border: none;
      background: none;
      font-size: 1.5rem;
      cursor: pointer;
      color: var(--text);
    }
    .gallery {
      max-width: 935px;
      margin: 2rem auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
      gap: 1px;
    }
    .gallery-item {
      position: relative;
      padding-bottom: 100%;
      overflow: hidden;
      cursor: pointer;
    }
    .gallery-item img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .viewer {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999;
    }
    .viewer.hidden {
      display: none;
    }
    #viewer-img {
      max-width: 90%;
      max-height: 90%;
    }
  </style>
</head>
<body>
  <header>
    <div class="profile">
      <img class="avatar" src="https://via.placeholder.com/150" alt="Profile picture"/>
      <div class="info">
        <h1 class="username">myprofile</h1>
        <div class="stats">
          <span><strong id="post-count">0</strong> posts</span>
          <span><strong>100</strong> followers</span>
          <span><strong>200</strong> following</span>
        </div>
      </div>
      <button id="dark-toggle" aria-label="Toggle dark mode">&#9788;</button>
    </div>
  </header>

  <div class="gallery" id="gallery"></div>

  <div id="viewer" class="viewer hidden">
    <img id="viewer-img" src="" alt="" />
  </div>

  <script>
    const baseURL = 'https://dev.tinysquares.io/';
    const workerURL = 'https://quiet-mouse-8001.flaxen-huskier-06.workers.dev/';
    let filenames = [];
    let currentIndex = 0;

    const viewer = document.getElementById('viewer');
    const viewerImg = document.getElementById('viewer-img');

    async function fetchFilenames() {
      const res = await fetch(workerURL);
      const list = await res.json();
      return list.sort(() => Math.random() - 0.5);
    }

    function showImage(index) {
      currentIndex = (index + filenames.length) % filenames.length;
      viewerImg.src = baseURL + filenames[currentIndex];
    }

    function openViewer(index) {
      showImage(index);
      viewer.classList.remove('hidden');
    }

    function closeViewer() {
      viewer.classList.add('hidden');
    }

    async function init() {
      const container = document.getElementById('gallery');
      filenames = await fetchFilenames();
      document.getElementById('post-count').textContent = filenames.length;
      filenames.forEach((name, idx) => {
        const div = document.createElement('div');
        div.className = 'gallery-item';
        const img = document.createElement('img');
        img.src = baseURL + name;
        div.appendChild(img);
        div.addEventListener('click', () => openViewer(idx));
        container.appendChild(div);
      });
    }

    init();

    viewer.addEventListener('click', closeViewer);

    document.getElementById('dark-toggle').addEventListener('click', () => {
      document.body.classList.toggle('dark-mode');
    });
  </script>
</body>
</html>
